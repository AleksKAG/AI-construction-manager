version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: stroy_assistent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stroy_assistent
      DB_USER: app
      DB_PASSWORD: secret
      REDIS_ADDR: redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  pgdata:
